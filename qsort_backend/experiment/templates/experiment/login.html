<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Q-Sort 主试端</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #eaf1ff 0%, #f6f8fc 100%);
      padding: 1rem;
    }
    .login-card { max-width: 400px; width: 100%; border: none; border-radius: 14px; box-shadow: 0 12px 40px rgba(13,110,253,.12); }
    .login-logo { width: 56px; height: 56px; border-radius: 14px; background: #0d6efd; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; }
    .input-group-text { border-radius: .5rem 0 0 .5rem; }
    #id_username, #id_password {
      width: 100%;
      border: 1px solid #dbe3ee;
      border-radius: 0 .5rem .5rem 0;
      padding: .55rem .8rem;
      font-size: .95rem;
    }
    #id_username:focus, #id_password:focus {
      outline: none;
      border-color: #0d6efd;
      box-shadow: 0 0 0 .2rem rgba(13,110,253,.12);
    }
    .errorlist { list-style: none; margin: .25rem 0 0; padding: 0; color: #dc3545; font-size: .8rem; }
  </style>
</head>
<body>

  <div class="card login-card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="login-logo mb-3"><i class="bi bi-clipboard-data-fill"></i></div>
        <h4 class="fw-semibold mb-1">Q-Sort 主试端</h4>
        <p class="text-muted small mb-0">请登录以访问实验数据管理台</p>
      </div>

      {% if form.non_field_errors %}
        <div class="alert alert-danger py-2 small">{{ form.non_field_errors }}</div>
      {% endif %}

      <form method="post" action="{% url 'experiment:login' %}" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="mb-3">
          <label class="form-label small fw-medium" for="id_username">用户名</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            {{ form.username }}
          </div>
          {{ form.username.errors }}
        </div>

        <div class="mb-4">
          <label class="form-label small fw-medium" for="id_password">密码</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            {{ form.password }}
          </div>
          {{ form.password.errors }}
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">
          <i class="bi bi-box-arrow-in-right me-1"></i>登 录
        </button>
      </form>
    </div>
  </div>

</body>
</html>
